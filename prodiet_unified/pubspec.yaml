name: prodiet_unified
description: ProDiet unified app — all themes, all screens, zero visual changes.
publish_to: 'none'
version: 1.0.0+100

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase (primary backend)
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Functional error handling
  dartz: ^0.10.1

  # Local Database (offline-first)
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.0

  # Connectivity
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Firebase (FCM push ONLY — no Firestore, no Auth)
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  firebase_crashlytics: ^4.1.0

  # Health / Fitband
  health: ^11.0.0

  # Image handling (for OCR pre-processing)
  image: ^4.1.7
  image_picker: ^1.1.2

  # HTTP for Open Food Facts
  http: ^1.2.1

  # URL launcher (Zomato/Blinkit/Swiggy redirects)
  url_launcher: ^6.3.0

  # Utilities
  logger: ^2.3.0
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Models (codegen)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI Utilities
  shimmer: ^3.0.0

  # Google Fonts (theme2 uses BarlowCondensed + DmSans)
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.68.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/ # assets/images/ — place app images here
    - assets/icons/  # assets/icons/ — place icon assets here
    - assets/fonts/

