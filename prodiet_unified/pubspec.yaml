name: prodiet_unified
description: ProDiet unified app — all themes, all screens, zero visual changes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Backend (scaffold — wired later)
  supabase_flutter: ^2.5.0

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Error Handling
  dartz: ^0.10.1

  # Models (codegen)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI Utilities
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Google Fonts (theme2 uses BarlowCondensed + DmSans)
  google_fonts: ^6.2.1

  # Charts
  fl_chart: ^0.68.0

  # Camera / OCR
  image_picker: ^1.1.0

  # Logging
  logger: ^2.4.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_lint: ^2.3.13
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit-ExtraBold.ttf
          weight: 800
  # assets:
  #   - assets/images/
  #   - assets/lottie/
