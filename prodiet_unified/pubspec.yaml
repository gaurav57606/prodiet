name: prodiet_unified
description: ProDiet unified app — all themes, all screens, zero visual changes.
publish_to: 'none'
version: 1.0.0+100

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase (primary backend)
  supabase_flutter: 2.12.4

  # State management
  flutter_riverpod: 2.6.1
  riverpod_annotation: 2.6.1

  # Navigation
  go_router: 17.0.0

  # Functional error handling
  dartz: 0.10.1

  # Local Database (offline-first)
  drift: 2.28.2
  drift_flutter: 0.2.7
  sqlite3_flutter_libs: 0.5.42

  # Connectivity
  connectivity_plus: 7.1.1
  device_info_plus: 12.4.0
  package_info_plus: 9.0.0

  # Notifications
  flutter_local_notifications: 17.2.2
  timezone: 0.9.4

  # Firebase (FCM push ONLY — no Firestore, no Auth)
  firebase_core: 4.7.0
  firebase_messaging: 16.2.0
  firebase_crashlytics: 5.2.0
  firebase_analytics: 11.3.0

  # Health / Fitband
  health: 13.3.1

  # Image handling (for OCR pre-processing)
  image: 4.8.0
  image_picker: 1.2.1
  permission_handler: 12.0.1

  # HTTP for Open Food Facts
  http: 1.6.0

  # URL launcher (Zomato/Blinkit/Swiggy redirects)
  url_launcher: 6.3.2

  # Utilities
  logger: 2.7.0
  cached_network_image: 3.4.1
  intl: 0.19.0
  uuid: 4.5.3
  crypto: 3.0.7
  vector_math: 2.1.4

  # Local Storage
  shared_preferences: 2.5.3
  flutter_secure_storage: 10.0.0

  # Models (codegen)
  freezed_annotation: 2.4.4
  json_annotation: 4.9.0

  # UI Utilities
  shimmer: 3.0.0

  # Google Fonts (theme2 uses BarlowCondensed + DmSans)
  google_fonts: 6.3.2

  # Charts
  fl_chart: 0.69.2

  # Icons
  cupertino_icons: 1.0.8
  flutter_svg: 2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: 2.6.4
  drift_dev: 2.28.0
  build_runner: 2.5.4
  freezed: 2.5.8
  json_serializable: 6.9.5
  flutter_lints: 6.0.0
  mocktail: 1.0.5
  fake_async: ^1.3.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env.json
    - assets/fonts/
