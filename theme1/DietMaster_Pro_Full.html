/* ═══════════════════════════════════════
   OUTER LAYOUT
═══════════════════════════════════════ */
body{background:var(--bg-page);transition:background .3s;}
.outer{
  display:flex;justify-content:center;align-items:flex-start;
  padding:24px 16px 60px;min-height:100vh;
  gap:20px;flex-wrap:wrap;
}
.col{display:flex;flex-direction:column;gap:0;}

/* theme switcher */
.theme-bar{
  width:100%;display:flex;justify-content:center;align-items:center;
  padding:16px 0 8px;gap:12px;
}
.t-btn{
  padding:8px 22px;border-radius:24px;font-size:12px;font-weight:700;
  border:1.5px solid rgba(160,100,255,.3);background:rgba(160,100,255,.08);
  color:rgba(160,100,255,.7);cursor:pointer;font-family:'Outfit',sans-serif;
  transition:all .2s;letter-spacing:.3px;
}
.t-btn.active{background:linear-gradient(135deg,#A060FF,#7030E0);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(140,60,255,.4);}
.t-lbl{font-size:11px;font-weight:600;color:rgba(160,100,255,.5);letter-spacing:.5px;text-transform:uppercase;}

/* ═══════════════════════════════════════
   PHONE
═══════════════════════════════════════ */
.phone{
  width:320px;border-radius:44px;overflow:hidden;
  position:relative;
  background:var(--bg-phone);
  border:1.5px solid var(--phone-border);
  box-shadow:var(--phone-shadow),inset 0 1px 0 rgba(255,255,255,.08);
  transition:all .3s;
}
.phone-label{
  text-align:center;font-size:10px;font-weight:700;
  color:rgba(160,100,255,.4);letter-spacing:.8px;text-transform:uppercase;
  margin-bottom:8px;
}
.sb{display:flex;justify-content:space-between;padding:13px 22px 5px;font-size:11px;font-weight:600;color:var(--sb-c);}
.scr{overflow-y:auto;overflow-x:hidden;scrollbar-width:none;max-height:670px;padding-bottom:72px;}
.scr::-webkit-scrollbar{display:none;}

/* ═══════════════════════════════════════
   TABS
═══════════════════════════════════════ */
.tabs{display:flex;gap:5px;overflow-x:auto;padding:0 12px 14px;scrollbar-width:none;flex-wrap:wrap;justify-content:center;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:5px 13px;border-radius:20px;font-size:10px;font-weight:700;
  border:1px solid var(--card-bd);background:var(--card-bg);
  color:var(--text3);cursor:pointer;font-family:'Outfit',sans-serif;
  transition:all .15s;white-space:nowrap;
}
.tab.on{background:var(--nav-on);color:#fff;border-color:transparent;}
.new-tab{border-color:rgba(255,80,100,.3);color:rgba(255,80,100,.7);}
.new-tab.on{background:linear-gradient(135deg,#FF4060,#C02040);border-color:transparent;}

/* ═══════════════════════════════════════
   SHARED COMPONENTS
═══════════════════════════════════════ */
.hero{
  background:var(--hero-bg);
  padding:16px 20px 20px;position:relative;overflow:hidden;
  border-bottom:1px solid var(--card-bd);
}
.hero::before{content:'';position:absolute;top:-50px;right:-30px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--hero-glow1) 0%,transparent 70%);}
.hero::after{content:'';position:absolute;bottom:-30px;left:10px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--hero-glow2) 0%,transparent 70%);}
.greet{font-size:11px;font-weight:500;color:var(--hero-sub);margin-bottom:3px;}
.hname{font-size:28px;font-weight:800;color:var(--hero-name);line-height:1;letter-spacing:-.3px;margin-bottom:2px;}
.hname em{color:var(--hero-em);font-style:normal;}
.htag{font-size:11px;color:var(--hero-sub);margin-bottom:14px;}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;}
.cal-n{font-size:44px;font-weight:800;color:var(--hero-cal);line-height:1;letter-spacing:-2px;}
.cal-l{font-size:11px;font-weight:500;color:var(--hero-sub);}
.streak{background:var(--streak-bg);border:1px solid var(--streak-bd);border-radius:12px;padding:8px 14px;text-align:center;}
.streak-n{font-size:22px;font-weight:800;color:var(--streak-n);line-height:1;}
.streak-l{font-size:9px;font-weight:700;color:var(--streak-l);text-transform:uppercase;letter-spacing:.8px;}

.sh{display:flex;justify-content:space-between;align-items:center;padding:0 18px;margin-bottom:9px;}
.sh-t{font-size:10px;font-weight:700;color:var(--sh-t);text-transform:uppercase;letter-spacing:1.2px;}
.sh-l{font-size:11px;font-weight:600;color:var(--sh-l);}

/* water */

.wfill.wn{background:var(--wn-fill);width:36%;}

.wf-v{font-size:12px;font-weight:700;color:var(--w-fv);}

.mt-ic.fat{background:var(--t-fat-ic);}
.mt-val{font-size:24px;font-weight:800;line-height:1;letter-spacing:-1px;}
.mt-val.std{color:var(--t-val);}
.mt-val.fat{color:var(--t-fat-c);}
.mt-unit{font-size:11px;font-weight:600;margin-left:2px;}
.mt-unit.std{color:var(--t-unit);}
.mt-unit.fat{color:var(--t-fat-cd);}
.mt-name{font-size:10px;font-weight:600;margin:3px 0 7px;}
.mt-name.std{color:var(--t-name);}
.mt-name.fat{color:var(--t-fat-cd);}
.mt-bar{height:3px;background:var(--t-bar);border-radius:3px;overflow:hidden;}

/* generic card */
.card{margin:0 13px 13px;background:var(--card-bg);border:1px solid var(--card-bd);border-radius:18px;padding:14px 16px;position:relative;overflow:hidden;}

.bnav{position:absolute;bottom:0;left:0;right:0;background:var(--nav-bg);border-top:1px solid var(--nav-bd);display:flex;align-items:center;padding:9px 0 20px;backdrop-filter:blur(20px);}

.fab svg{width:20px;height:20px;fill:none;stroke-width:2.2;stroke:var(--fab-ic);}
.fab-w span{font-size:8px;font-weight:700;letter-spacing:.3px;color:var(--nav-lbl);}

/* back btn */
.bk{display:flex;align-items:center;gap:8px;padding:12px 18px 4px;cursor:pointer;}

.bk-t{font-size:12px;font-weight:700;color:var(--sh-l);}

/* list items */
.li{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--card-bd);}

.day-tabs{display:flex;gap:6px;padding:0 13px 12px;overflow-x:auto;scrollbar-width:none;}

.dt{padding:7px 12px;border-radius:12px;font-size:10px;font-weight:700;background:var(--day-bg);border:1px solid var(--card-bd);color:var(--text3);white-space:nowrap;cursor:pointer;text-align:center;transition:all .15s;}

.dt-n{font-size:13px;font-weight:800;display:block;}

.ml-item{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--card-bd);}
.ml-item:last-child{border-bottom:none;}
.ml-time{width:38px;text-align:right;flex-shrink:0;}

/* inventory bars */

/* recipe card */

.rec-btn{background:var(--nav-on);color:#fff;border:none;border-radius:10px;padding:9px;font-size:11px;font-weight:700;width:100%;font-family:'Outfit',sans-serif;cursor:pointer;}

/* voice waveform */
@keyframes wv{0%,100%{height:4px}50%{height:22px}}

.wf-bar:nth-child(5){animation:wv .6s ease-in-out infinite .28s;}
.wf-bar:nth-child(6){animation:wv .6s ease-in-out infinite .35s;}
.wf-bar:nth-child(7){animation:wv .6s ease-in-out infinite .28s;}
.wf-bar:nth-child(8){animation:wv .6s ease-in-out infinite .21s;}
.wf-bar:nth-child(9){animation:wv .6s ease-in-out infinite .14s;}

/* ocr scan */
@keyframes scan{0%{top:10%}100%{top:90%}}

    {id:'home',icon:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',label:'Home',screen:'dashboard'},
    {id:'meals',icon:'<path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>',label:'Meals',screen:'meals'},
    {id:'voice',fab:true,icon:'<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/>',label:'Voice',screen:'voice'},
    {id:'stock',icon:'<path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>',label:'Stock',screen:'inventory'},
    {id:'plan',icon:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',label:'Plan',screen:'plan'},
  ];
  return items.map(item=>{
    if(item.fab) return `<div class="fab-w" onclick="goScreen('${item.screen}')"><div class="fab"><svg viewBox="0 0 24 24">${item.icon}</svg></div><span>${item.label}</span></div>`;
    const on=activeNav===item.id;
    return `<div class="bn ${on?'on':''}" onclick="goScreen('${item.screen}')"><svg viewBox="0 0 24 24">${item.icon}</svg><span>${item.label}</span></div>`;
  }).join('');
}

function tabsHtml(active){
  const tabs=[
    {id:'dashboard',label:'Dashboard'},
    {id:'meals',label:'Meal Planner'},
    {id:'water',label:'Water'},
    {id:'plan',label:'Diet Plan'},
    {id:'inventory',label:'Inventory'},
    {id:'ocr',label:'OCR Scanner',new:true},
    {id:'recipe',label:'Recipe Explorer',new:true},
    {id:'comp',label:'Compensation',new:true},
    {id:'voice',label:'Voice Entry',new:true},
    {id:'vendor',label:'Vendor & Order',new:true},
    {id:'fitband',label:'Fitband',new:true},
    {id:'allergy',label:'Allergies',new:true},
  ];
  return tabs.map(t=>`<div class="tab ${t.new?'new-tab':''} ${active===t.id?'on':''}" onclick="goScreen('${t.id}')">${t.label}</div>`).join('');
}

function renderAll(){
  const s=screens[currentScreen];
  const content=s.build();
  const nav=s.nav;
  document.getElementById('app').innerHTML=`
    <div class="col" style="width:100%;max-width:720px;">
      <div class="tabs">${tabsHtml(currentScreen)}</div>
      <div style="display:flex;justify-content:center;">
        <div>
          <div class="phone">
            <div class="sb"><span>9:41</span><span style="letter-spacing:2px;opacity:.4;">···</span></div>
            <div class="scr" id="scr">${content}</div>
            <div class="bnav">${navHtml(nav)}</div>
          </div>
        </div>
      </div>
    </div>`;
}

function goScreen(id){
  currentScreen=id;
  renderAll();
  document.getElementById('scr')?.scrollTo(0,0);
}

function setTheme(t){
  document.body.className=t;
  document.getElementById('btn-dark').classList.toggle('active',t==='dark');
  document.getElementById('btn-light').classList.toggle('active',t==='light');
  renderAll();
}

/* water state */
function setW(s,btn){
  wState=s;
  const d=wData[s];
  ['wpill','w2pill'].forEach(id=>{const el=document.getElementById(id);if(!el)return;el.className='wpill '+d.cls;el.textContent=d.pill;});
  ['wtimer','w2timer'].forEach(id=>{const el=document.getElementById(id);if(!el)return;el.className='wtimer '+d.cls;el.innerHTML=d.cls==='ov'?'<span style="font-size:30px;font-weight:700;letter-spacing:0">Late</span>':d.timer+'<span style="font-size:28px;font-weight:600;letter-spacing:0">m</span>';});
  ['wsub','w2sub'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=d.sub;});
  ['wfill','w2fill'].forEach(id=>{const el=document.getElementById(id);if(el)el.className='wfill '+d.cls;});
  const wa=document.getElementById('wamt');if(wa)wa.textContent=d.amt;
  document.querySelectorAll('.wtg').forEach(b=>b.classList.remove('on'));
  document.querySelectorAll(`.wtg`).forEach(b=>{if(b.textContent.toLowerCase().startsWith(s==='ok'?'on':s==='wn'?'al':'ov'))b.classList.add('on');});
}

/* meal nav */
function prevMeal(){curMeal=(curMeal-1+meals.length)%meals.length;goScreen('meals');}
function nextMeal(){curMeal=(curMeal+1)%meals.length;goScreen('meals');}

/* recipe nav */
function prevRec(){rIdx=(rIdx-1+recipes.length)%recipes.length;goScreen('recipe');}
function nextRec(){rIdx=(rIdx+1)%recipes.length;goScreen('recipe');}
function toggleRec(){rIdx=1;goScreen('recipe');}

/* variety toggle */
function setVar(v){
  const s=document.getElementById('vt-s'),e=document.getElementById('vt-e');
  if(!s||!e)return;
  s.className='vt-o '+(v==='s'?'on':'');
  e.className='vt-o '+(v==='e'?'on':'');
}

/* initial render */
renderAll();
</script>
</body>
</html>
