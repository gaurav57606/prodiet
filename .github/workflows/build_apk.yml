name: ProDiet — Build APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths:
      - 'prodiet_unified/**'
      - '.github/workflows/build_apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'prodiet_unified/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: prodiet_unified

    steps:
      # ── 1. Checkout ──────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required for AGP 8 / compileSdk 35) ─────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter 3.29.3 stable ────────────────────────────
      # Must match the Flutter version used during development.
      # withValues() and CardThemeData require Flutter >= 3.27
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      # ── 4. Create .env.json from GitHub Secrets ──────────────
      - name: Create .env.json from secrets
        run: |
          cat > .env.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}"
          }
          EOF

      # ── 5. Create google-services.json from secret ───────────
      - name: Create google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      # ── 6. Flutter pub get ───────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 7. Flutter analyze (warnings only — don't block build) ─
      # NOTE: project has pre-existing lint warnings (unused imports, const
      # suggestions). These are tracked separately and do not block APK output.
      # Change continue-on-error to false once warnings are resolved.
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      # ── 8. Build DEBUG APK ───────────────────────────────────
      - name: Build DEBUG APK
        if: |
          github.event.inputs.build_type == 'debug' ||
          github.event.inputs.build_type == 'both'  ||
          github.event.inputs.build_type == ''
        run: |
          flutter build apk \
            --debug \
            --dart-define-from-file=.env.json

      # ── 9. Build RELEASE APK (signed with debug key if no keystore) ─
      - name: Build RELEASE APK
        if: |
          github.event.inputs.build_type == 'release' ||
          github.event.inputs.build_type == 'both'
        run: |
          flutter build apk \
            --release \
            --dart-define-from-file=.env.json \
            --obfuscate \
            --split-debug-info=build/debug-info

      # ── 10. Rename APKs with date + short SHA ─────────────────
      - name: Rename APK artifacts
        if: always()
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          DATE=$(date +'%Y%m%d')
          mkdir -p build/app/outputs/flutter-apk

          DEBUG_SRC="build/app/outputs/flutter-apk/app-debug.apk"
          if [ -f "$DEBUG_SRC" ]; then
            cp "$DEBUG_SRC" "build/app/outputs/flutter-apk/prodiet-debug-${DATE}-${SHORT_SHA}.apk"
            echo "DEBUG_APK=prodiet-debug-${DATE}-${SHORT_SHA}.apk" >> $GITHUB_ENV
          fi

          RELEASE_SRC="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$RELEASE_SRC" ]; then
            cp "$RELEASE_SRC" "build/app/outputs/flutter-apk/prodiet-release-${DATE}-${SHORT_SHA}.apk"
            echo "RELEASE_APK=prodiet-release-${DATE}-${SHORT_SHA}.apk" >> $GITHUB_ENV
          fi

      # ── 11. Upload DEBUG APK ─────────────────────────────────
      - name: Upload DEBUG APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodiet-debug-apk
          path: prodiet_unified/build/app/outputs/flutter-apk/prodiet-debug-*.apk
          if-no-files-found: ignore
          retention-days: 7

      # ── 12. Upload RELEASE APK ─────────────────────────────
      - name: Upload RELEASE APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodiet-release-apk
          path: prodiet_unified/build/app/outputs/flutter-apk/prodiet-release-*.apk
          if-no-files-found: ignore
          retention-days: 14

      # ── 13. Upload obfuscation debug symbols ─────────────────
      - name: Upload debug symbols
        if: |
          github.event.inputs.build_type == 'release' ||
          github.event.inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: prodiet-debug-symbols
          path: prodiet_unified/build/debug-info/
          if-no-files-found: ignore
          retention-days: 30

      # ── 14. Build summary ────────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## 🏗️ ProDiet Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${GITHUB_SHA:0:7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Flutter | 3.29.3 stable |" >> $GITHUB_STEP_SUMMARY
          echo "| Build type | ${{ github.event.inputs.build_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          DEBUG_APK=$(ls build/app/outputs/flutter-apk/prodiet-debug-*.apk 2>/dev/null | head -1)
          RELEASE_APK=$(ls build/app/outputs/flutter-apk/prodiet-release-*.apk 2>/dev/null | head -1)

          if [ -n "$DEBUG_APK" ]; then
            SIZE=$(du -sh "$DEBUG_APK" | cut -f1)
            echo "| Debug APK | ✅ $SIZE |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Debug APK | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -n "$RELEASE_APK" ]; then
            SIZE=$(du -sh "$RELEASE_APK" | cut -f1)
            echo "| Release APK | ✅ $SIZE |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Release APK | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          fi
