name: ProDiet — Build APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main ]
    paths:
      - 'prodiet_unified/**'
      - '.github/workflows/build_apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'prodiet_unified/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: prodiet_unified

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      # IMPORTANT: Use unquoted heredoc (<<ENVEOF not <<'ENVEOF')
      # Single-quoted heredoc disables ${{ }} expansion → empty secrets
      - name: Create .env.json
        run: |
          cat > .env.json <<ENVEOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "GEMINI_API_KEY": "${{ secrets.GEMINI_API_KEY }}",
            "OPEN_FOOD_FACTS_BASE_URL": "https://world.openfoodfacts.org/api/v2"
          }
          ENVEOF

      # Verify secrets are actually set — fail early with clear message
      - name: Verify required secrets
        run: |
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is not set in GitHub Actions secrets"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is not set in GitHub Actions secrets"
            exit 1
          fi
          echo "Secrets verified. Supabase URL starts with: ${SUPABASE_URL:0:20}..."

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' | python3 -c "import sys,json; data=json.load(sys.stdin); open('android/app/google-services.json','w').write(json.dumps(data,indent=2)); print('OK:', data['project_info']['project_id'])"

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Build DEBUG APK
        if: |
          github.event.inputs.build_type == 'debug' ||
          github.event.inputs.build_type == 'both'  ||
          github.event.inputs.build_type == ''
        run: |
          flutter build apk \
            --debug \
            --dart-define-from-file=.env.json

      - name: Build RELEASE APK
        if: |
          github.event.inputs.build_type == 'release' ||
          github.event.inputs.build_type == 'both'
        run: |
          flutter build apk \
            --release \
            --dart-define-from-file=.env.json \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Rename APK artifacts
        if: always()
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          DATE=$(date +'%Y%m%d')
          mkdir -p build/app/outputs/flutter-apk
          DEBUG_SRC="build/app/outputs/flutter-apk/app-debug.apk"
          if [ -f "$DEBUG_SRC" ]; then
            cp "$DEBUG_SRC" "build/app/outputs/flutter-apk/prodiet-debug-${DATE}-${SHORT_SHA}.apk"
          fi
          RELEASE_SRC="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$RELEASE_SRC" ]; then
            cp "$RELEASE_SRC" "build/app/outputs/flutter-apk/prodiet-release-${DATE}-${SHORT_SHA}.apk"
          fi

      - name: Upload DEBUG APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodiet-debug-apk
          path: prodiet_unified/build/app/outputs/flutter-apk/prodiet-debug-*.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload RELEASE APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prodiet-release-apk
          path: prodiet_unified/build/app/outputs/flutter-apk/prodiet-release-*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug symbols
        if: |
          github.event.inputs.build_type == 'release' ||
          github.event.inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: prodiet-debug-symbols
          path: prodiet_unified/build/debug-info/
          if-no-files-found: ignore
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          printf '%s\n' '## ProDiet Build Summary' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '| Item | Value |' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          printf '| Commit | `%s` |\n' "${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
          printf '| Flutter | %s |\n' '3.29.3 stable' >> "$GITHUB_STEP_SUMMARY"
          DEBUG_APK=$(ls build/app/outputs/flutter-apk/prodiet-debug-*.apk 2>/dev/null | head -1)
          RELEASE_APK=$(ls build/app/outputs/flutter-apk/prodiet-release-*.apk 2>/dev/null | head -1)
          [ -n "$DEBUG_APK" ]   && printf '| Debug APK | Built %s |\n' "$(du -sh $DEBUG_APK | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$RELEASE_APK" ] && printf '| Release APK | Built %s |\n' "$(du -sh $RELEASE_APK | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          true
