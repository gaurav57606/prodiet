name: dietmate_pro
description: A senior-grade Diet Management App UI.
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.0.0

  # Backend (scaffold)
  supabase_flutter: ^2.5.0

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Error Handling
  dartz: ^0.10.1

  # Models (codegen)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI Utilities
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  google_fonts: ^6.2.1

  # Charts (for progress + nutrition screens)
  fl_chart: ^0.68.0

  # Camera (for OCR screen — scaffold only)
  image_picker: ^1.1.0

  # Logging (never use print())
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_lint: ^2.3.13
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
